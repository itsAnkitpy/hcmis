; HCIMS staging — the switchboard's phone directory.
; Public address 216.48.185.111 sits directly on this machine (ens8), so no
; external_media_address workaround is needed — that was a lab/Docker artefact.

;=== How calls arrive from Twilio (plain UDP on the public address) ===
[transport-udp]
type=transport
protocol=udp
bind=216.48.185.111:5060

;=== How the agent's browser phone arrives (through Apache, so from this machine) ===
[transport-ws]
type=transport
protocol=ws
bind=127.0.0.1

;=== Agent one's browser phone (user 6) ===
[1003]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=auth1003
aors=1003
webrtc=yes

[auth1003]
type=auth
auth_type=userpass
username=1003
password=__AG1_PW__

[1003]
type=aor
max_contacts=1
remove_existing=yes

;=== Agent two's browser phone (user 7) ===
[1004]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=auth1004
aors=1004
webrtc=yes

[auth1004]
type=auth
auth_type=userpass
username=1004
password=__AG2_PW__

[1004]
type=aor
max_contacts=1
remove_existing=yes
