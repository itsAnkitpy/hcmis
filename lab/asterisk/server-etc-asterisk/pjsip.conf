; HCIMS staging — the switchboard's phone directory.
; Public address 216.48.185.111 sits directly on this machine (ens8), so no
; external_media_address workaround is needed — that was a lab/Docker artefact.

;=== How calls arrive from Twilio (plain UDP on the public address) ===
[transport-udp]
type=transport
protocol=udp
bind=216.48.185.111:5060

;=== How the agent's browser phone arrives (through Apache, so from this machine) ===
[transport-ws]
type=transport
protocol=ws
bind=127.0.0.1

;=== Agent one's browser phone (user 6) ===
[1003]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=auth1003
aors=1003
webrtc=yes

[auth1003]
type=auth
auth_type=userpass
username=1003
password=__AG1_PW__

[1003]
type=aor
max_contacts=1
remove_existing=yes

;=== Agent two's browser phone (user 7) ===
[1004]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=auth1004
aors=1004
webrtc=yes

[auth1004]
type=auth
auth_type=userpass
username=1004
password=__AG2_PW__

[1004]
type=aor
max_contacts=1
remove_existing=yes

;=== The outside line — calls arriving from Twilio (trunk "hcmis-test") ===
; No login: Twilio never registers with us. It proves who it is by the address
; the call comes from, which is what the doorman list below is for.
[twilio]
type=endpoint
context=internal
transport=transport-udp
disallow=all
allow=ulaw
; --- dialling out through Twilio ---
aors=twilio
outbound_auth=authtwilio
from_domain=hcmis-test.pstn.twilio.com
; Twilio rejects any outgoing call whose "from" number is not one of its own
; numbers or one we verified. One number in v1 (O2) — per-campaign numbers are
; the thing that removes this line.
from_user=+19787966797
; Asterisk's default is to step out of the way and let the two ends send audio
; straight to each other. Twilio and a browser phone cannot do that — leave this
; on and the call connects with both people hearing silence.
direct_media=no
; Take the audio from where it actually arrives. Twilio's audio comes from a
; different address range than its call setup, which is normal and expected.
rtp_symmetric=yes

;=== The doorman list: a call from any of these eight blocks IS Twilio ===
; Twilio's regional call-setup gateways, checked against
; https://www.twilio.com/docs/sip-trunking/ip-addresses on 2026-08-05.
; SAME eight blocks as the firewall rule in server-build-log.md §4 —
; if one list changes, the other must change with it.
[twilio]
type=identify
endpoint=twilio
match=54.172.60.0/30
match=54.244.51.0/30
match=54.171.127.192/30
match=35.156.191.128/30
match=54.65.63.192/30
match=54.169.127.128/30
match=54.252.254.64/30
match=177.71.206.192/30

;=== Where to send calls we place ===
[twilio]
type=aor
contact=sip:hcmis-test.pstn.twilio.com

;=== How we prove who we are when we place one ===
; Matches the credential list on the trunk's Termination tab. Twilio may not
; even ask — the address list on that tab lets 216.48.185.111 straight through —
; but both are configured on purpose. An outside line left open is somebody
; else's phone bill on our card.
[authtwilio]
type=auth
auth_type=userpass
username=hcmisstaging
password=__TWILIO_PW__
