; HCIMS staging — the door the APP uses to drive calls (dial, answer, hang up, record).
[general]
enabled=yes
pretty=no
; Send the company stamp along with every call event, so the app can read which
; company an arriving call belongs to (RD-1). Without this line the dialplan sets
; the variable but the app never sees it and hangs the call up as unlabelled.
; Paired with extensions.conf's Set(tenantid=1) — change one, change both.
channelvars=tenantid

[hcmis]
type=user
read_only=no
password=__ARI_PW__
