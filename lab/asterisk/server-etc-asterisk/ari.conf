; HCIMS staging — the door the APP uses to drive calls (dial, answer, hang up, record).
[general]
enabled=yes
pretty=no
; Send the dialled number along with every call event (B2.3a ND-3). extensions.conf
; writes it down before the jump to 800; this line is what actually carries it to
; the app, which resolves it into "which client is this call for?". Without it the
; dialplan sets the variable, the app never sees it, and EVERY inbound call is hung
; up as an unknown number. Change one file, change both.
;
; `tenantid` was removed with the hardcoded client it carried (ND-1).
channelvars=dialednumber

[hcmis]
type=user
read_only=no
password=__ARI_PW__
