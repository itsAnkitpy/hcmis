; HCIMS staging — which parts of the switchboard to load.
;
; WHY THIS FILE EXISTS (found the hard way, 2026-08-05):
; Ubuntu's Asterisk package loads chan_sip, the OLD phone system, deprecated
; since Asterisk 17. Both it and the current one (PJSIP) want to handle browser
; phone connections, and both register the same "sip" name for it. Whichever
; loads first wins; the other gives up. chan_sip won, so:
;
;   ERROR: res_pjsip_transport_websocket declined to load.
;   NOTICE: Registration from '<sip:1003@asterisk.lab>' failed - Wrong password
;
; The agent's browser phone was talking to the old system, which has never
; heard of phone 1003, so it rejected every login. The "wrong password" was a
; red herring — the real phone directory never saw the request at all.
; The same collision also caused: "Failed to bind to 0.0.0.0:5060: Address
; already in use" — the two were fighting over the call-setup port.
;
; Mirrors lab/asterisk/etc-asterisk/modules.conf, which had this right already.

[modules]
autoload=yes

; The old phone system. THIS IS THE IMPORTANT LINE — see above.
noload = chan_sip.so

; Packet-capture reporting we do not use; it logs errors on every start.
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so

; Voicemail backends for mail servers and databases we do not have.
noload = app_voicemail_imap.so
noload = app_voicemail_odbc.so

; Sound card driver — there is no sound card on a server.
noload = chan_alsa.so
