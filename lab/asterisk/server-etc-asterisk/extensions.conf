; HCIMS staging — what happens when a call arrives.
[internal]

; 600 = echo test. Proves audio flows both ways with the app not involved.
exten => 600,1,Answer()
 same => n,Echo()

; 800 = the app's front door. Stamps which company the call belongs to (RD-1),
; then hands the call to the app.
exten => 800,1,Set(CHANNEL(tenantid)=1)
 same => n,Stasis(hcmis-lab)
 same => n,Hangup()

; PREP-1: Twilio puts the DIALLED number here, never "800". Both spellings,
; because carriers disagree about the leading +. Both jump to 800 so the
; company stamp and the hand-off stay defined in one place.
exten => +19787966797,1,Goto(800,1)
exten => 19787966797,1,Goto(800,1)
