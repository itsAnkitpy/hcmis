; HCIMS staging — what happens when a call arrives.
[internal]

; 600 = echo test. Proves audio flows both ways with the app not involved.
exten => 600,1,Answer()
 same => n,Echo()

; 800 = the app's front door. It hands the call to the app and nothing else.
;
; This file no longer knows ANYTHING about clients (B2.3a ND-1). It used to stamp
; Set(tenantid=1) here — one hardcoded client on every inbound call, which is the
; single reason a second client could never have a phone number. The app now reads
; the dialled number noted below and looks the owner up in the phone_numbers list,
; so onboarding a client is a screen, not an edit-push-copy-reload on this server.
exten => 800,1,Stasis(hcmis-lab)
 same => n,Hangup()

; ND-1/ND-3: the carrier puts the DIALLED number here, never "800". Two patterns,
; because carriers disagree about the leading + — one with, one without. Neither
; names a specific number, so THIS FILE IS NEVER EDITED AGAIN when a client joins:
; the number->client list lives in the database and the app does the lookup.
;
; The number is written down as a note on the call BEFORE the jump, because
; Goto(800,1) makes the call's extension literally "800" — read it after the jump
; and every call reports 800. ari.conf's channelvars line carries this note to the
; app; the two must change together.
;
; The no-+ pattern needs 10+ digits so it cannot swallow 600, 800 or an agent's
; 4-digit extension. A literal extension always beats a pattern in Asterisk, so
; 600 and 800 would win anyway — the digit floor is the belt to that braces.
;
; 🔴 THE NO-+ PATTERN PUTS THE + BACK ON. The note the app reads is ALWAYS E.164
; with a leading + (+19787966797), whichever spelling the carrier used, because
; the app matches it against the stored number as an exact string. Without this,
; a carrier that drops the + would miss every stored number and every call would
; be hung up as "unknown number" — a silent, total inbound failure. Normalise
; here, at the one place the two spellings differ.
exten => _+X.,1,Set(dialednumber=${EXTEN})
 same => n,Goto(800,1)
exten => _XXXXXXXXX.,1,Set(dialednumber=+${EXTEN})
 same => n,Goto(800,1)
