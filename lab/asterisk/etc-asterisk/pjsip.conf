; HCIMS lab — two softphone "desk phones" + one browser phone on one local switchboard.
; Verified against the Asterisk 20 res_pjsip docs. PJSIP only (chan_sip is dead in 21).

;=== Transport: how SIP packets arrive (plain UDP is fine for the lab) ===
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
; Mac/Docker NAT: Asterisk is inside a container, softphones are on the host.
; Advertise a HOST-reachable media address so the phone sends RTP to a place that
; maps back into the container (the published 10000-10019 ports live on all host IPs).
; NOTE: this is the host's LAN IP — it changes with the network; re-check on a new Wi-Fi.
external_media_address=192.168.29.241
external_signaling_address=192.168.29.241

;=== Phone 1001 — register Linphone as this ===
[1001]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=auth1001
aors=1001
; NAT handling for a softphone reached across the Docker boundary
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[auth1001]
type=auth
auth_type=userpass
username=1001
password=lab-pass-1001

[1001]
type=aor
max_contacts=1
remove_existing=yes
; A2 fix: ping the phone every 30s. Keeps the queue's "is the agent reachable?"
; answer truthful, and the steady traffic stops the idle phone's registration
; renewals from silently stalling (hit in A2: contacts expired after ~14 min idle).
qualify_frequency=30

;=== Phone 1002 — register Zoiper as this ===
[1002]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=auth1002
aors=1002
; CP2b live test: present a real PW lead's number so the agent screen matches a
; lead on the ring (lab-only; swap/remove to test the "no matching lead" path).
callerid=Jade Grimes <9310967193>
; NAT handling for a softphone reached across the Docker boundary
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[auth1002]
type=auth
auth_type=userpass
username=1002
password=lab-pass-1002

[1002]
type=aor
max_contacts=1
remove_existing=yes
; same A2 fix as 1001
qualify_frequency=30

;=== A4: the BROWSER phone (WebRTC) ===========================================
; The browser's SIP "wire" is a WebSocket riding the SAME mini web server ARI
; uses (http.conf, port 8088) at the path /ws — no new port, no new listener.
; Plain ws:// (not wss://) is fine HERE ONLY because the page is served from
; 127.0.0.1, which browsers treat as already-secure. Production needs wss:// +
; a real cert (infra §2.9).
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; The browser endpoint. webrtc=yes pulls in everything a browser mandates —
; ICE, AVPF, rtcp_mux, DTLS encryption with an auto-generated per-session cert,
; fingerprint verify (checked against THIS build's own option docs, 20.19.0:
; "config show help res_pjsip endpoint webrtc"). So: no manual cert work.
[1003]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=auth1003
aors=1003
webrtc=yes

[auth1003]
type=auth
auth_type=userpass
username=1003
password=lab-pass-1003

[1003]
type=aor
max_contacts=1
remove_existing=yes
; no qualify_frequency here: a browser tab's contact lives exactly as long as
; its WebSocket — when the tab closes, the transport drops and the contact goes
; with it. Nothing to ping.

; The SECOND browser endpoint (B2.2b RD-6). A true "pick among several" test needs
; two DISTINCT agent phones — user 7 (def@gmail.com) logs into a 2nd browser profile
; and registers as 1004. Mirrors 1003 exactly (webrtc=yes, max_contacts=1); only the
; identity + secret differ. Set TELEPHONY_AGENT2_PASSWORD in .env to this secret.
[1004]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=auth1004
aors=1004
webrtc=yes

[auth1004]
type=auth
auth_type=userpass
username=1004
password=lab-pass-1004

[1004]
type=aor
max_contacts=1
remove_existing=yes
