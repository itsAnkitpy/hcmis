; HCIMS lab — call queues ("a caller waits here until an agent is free").
; Verified against the Asterisk 20 queues.conf.sample. Without this file app_queue
; refuses to start, so its mere presence is what turns queueing on.

[general]
; don't remember queue members across restarts — the lab re-declares them below
persistentmembers = no

;=== The one lab queue: callers who "press 1" wait here for an agent ===
[sales]
strategy = ringall          ; ring every free agent at once (only 1001 exists anyway)
timeout = 15                ; ring an agent 15s per attempt before giving up on them
retry = 2                   ; wait 2s between attempts
; The agent's phone. Static member = always "on shift" — fine for the lab;
; real agent log-in/log-out comes later via ARI (A3+).
member => PJSIP/1001
