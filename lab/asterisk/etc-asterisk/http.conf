; HCIMS lab — Asterisk's built-in mini web server. ARI (the "app drives calls" API)
; rides on this: plain web requests + one event stream. Off by default; we turn it on.
; Verified against the Asterisk 20 sample (configs/samples/http.conf.sample):
;   enabled  — default is no
;   bindaddr — REQUIRED, no default; 0.0.0.0 = listen on all addresses *inside the
;              container* (Docker publishes it to the Mac as port 8088)
;   bindport — default is 8088; written out anyway so nothing is implicit
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
