; HCIMS lab dialplan — "when someone dials 1001, ring phone 1001"; same for 1002.
; The context name [internal] must match context=internal on the endpoints in pjsip.conf.
[internal]
exten => 1001,1,Dial(PJSIP/1001,20)
exten => 1002,1,Dial(PJSIP/1002,20)

; --- A1 audio test extensions (lab only) ---
; 600 = echo: Asterisk sends back whatever it hears → proves BOTH RTP directions
exten => 600,1,Answer()
 same => n,Echo()
; 601 = one-way: Asterisk plays a prompt → proves Asterisk→phone RTP only
; (the image ships NO sound files — this only works with our own prompt mounted in)
exten => 601,1,Answer()
 same => n,Playback(lab-menu)
 same => n,Hangup()

; --- A2: menu → queue → recording (lab only) ---
; 700 = the front door. A menu answers; a keypress routes the call.
exten => 700,1,Goto(lab-ivr,s,1)

; --- A3: hand the call to the APP via ARI (lab only) ---
; 800 = the app's front door. Stasis() parks the call with the named ARI app —
; from that moment the dialplan stops deciding and the APP decides (answer,
; bridge, record, transfer, hang up). If no app named "hcmis-lab" is connected,
; Stasis() just falls through to the next line and the call ends politely.
; B2.3a ND-1: this file knows NOTHING about clients. The old Set(CHANNEL(tenantid)=1)
; stamped one hardcoded company on every inbound call — the exact line that stopped a
; second client ever having a phone number. The app now reads the dialled number noted
; below and looks its owner up in the phone_numbers list, so this must MIRROR the
; server's dialplan or a lab call resolves to nothing and is hung up as unknown.
exten => 800,1,Stasis(hcmis-lab)
 same => n,Hangup()

; ND-1/ND-3: the number the caller dialled, noted BEFORE the jump (after it, the
; call's extension is literally "800"). Two patterns, one per spelling, because
; carriers and softphones disagree about the leading + — and the no-+ one puts the +
; back on, so the app always sees one E.164 spelling to match against. Neither names
; a specific number: adding a client never touches this file again.
;
; Dial +19787966797 (or 19787966797) from a lab softphone to exercise the path with
; no server and no carrier. The number must exist in phone_numbers, switched on.
exten => _+X.,1,Set(dialednumber=${EXTEN})
 same => n,Goto(800,1)
exten => _XXXXXXXXX.,1,Set(dialednumber=+${EXTEN})
 same => n,Goto(800,1)

[lab-ivr]
; s = "start here". BackGround plays the menu AND listens for a key at the same
; time; WaitExten keeps listening after the audio ends (verified: Asterisk 20 docs).
exten => s,1,Answer()
 same => n(menu),BackGround(lab-menu)
 same => n,WaitExten(10)

; pressed 1 → start recording, then wait in the queue until agent 1001 answers.
; MixMonitor writes 3 files: the mixed call, plus each side alone (r = what the
; caller said, t = what the caller heard). The two single-side files become the
; stereo recording (PW5-4: one party per channel) after the call.
exten => 1,1,Set(REC=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,MixMonitor(${REC}-mix.wav,r(${REC}-caller.wav)t(${REC}-agent.wav))
 same => n,Queue(sales,r)
 same => n,Hangup()

; pressed 2 → same echo test as 600
exten => 2,1,Echo()

; i = "invalid key": say so, replay the menu
exten => i,1,Playback(lab-invalid)
 same => n,Goto(s,menu)

; t = "took too long": hang up
exten => t,1,Hangup()
