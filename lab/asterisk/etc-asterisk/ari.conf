; HCIMS lab — ARI (Asterisk REST Interface): the door the APP uses to drive calls
; (dial, answer, hang up, transfer, record). Needs http.conf enabled too.
; Verified against the Asterisk 20 sample (configs/samples/ari.conf.sample).
[general]
enabled=yes
pretty=yes          ; format API replies for human reading — lab convenience only

; B2.3a ND-3: carry the dialled number to the app with every call event, so it can
; look up which client owns the number. The lab needed no such line before, because
; the old hardcoded company rode Asterisk's built-in tenant slot, which arrives on
; the channel by itself. A plain variable does NOT — without this line the lab
; dialplan notes the number and the app never sees it, and every lab inbound call
; is hung up as an unknown number. Mirrors the server's ari.conf.
channelvars=dialednumber

; One login for the lab script (and later the Laravel app) to authenticate with.
; Lab-only throwaway password, same policy as the phone passwords in pjsip.conf —
; never reuse anywhere real.
[hcmis-lab]
type=user
read_only=no        ; the app must be allowed to *do* things, not just look
password=lab-pass-ari
