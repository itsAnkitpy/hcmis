; HCIMS lab — narrow the voice (RTP) port range so it's cheap to map on Mac/Docker.
; Asterisk's default is 10000-20000; two phones need only a handful of ports.
[general]
rtpstart=10000
rtpend=10019

; A4 — the Mac/Docker NAT fix, WebRTC flavor. WebRTC addresses media by ICE
; candidates, NOT by the transport's external_media_address — and the candidate
; Asterisk would offer is the container's own IP, which the Mac can't reach
; (Docker Desktop runs containers inside a VM). This swaps it for the Mac's LAN
; IP, where the published 10000-10019/udp ports actually live.
; NOTE: BOTH addresses change — left side if the compose network is recreated
; (docker inspect hcmis-lab-asterisk shows it), right side with your Wi-Fi (the
; same LAN IP as pjsip.conf — this is now the FOURTH file carrying it).
[ice_host_candidates]
172.19.0.2 => 192.168.29.241
